 Evaluation</text><text x="700" y="280" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13px" fill="#667269" font-weight="400" text-anchor="middle">Raw × Reliability</text><text x="793" y="278" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25px" fill="#d56634" font-weight="700" text-anchor="middle">→</text><rect x="815" y="205" width="150" height="132" rx="13" fill="#fffdf7" stroke="#dcd8ca" stroke-width="1"/><text x="890" y="247" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17px" fill="#19231d" font-weight="700" text-anchor="middle">Support / Coverage</text><text x="890" y="280" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13px" fill="#667269" font-weight="400" text-anchor="middle">Σwᵢ and Σwᵢ/N</text><text x="983" y="278" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25px" fill="#d56634" font-weight="700" text-anchor="middle">→</text><rect x="1005" y="205" width="150" height="132" rx="13" fill="#fffdf7" stroke="#176b52" stroke-width="2"/><text x="1080" y="247" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17px" fill="#176b52" font-weight="700" text-anchor="middle">Decision</text><text x="1080" y="280" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13px" fill="#667269" font-weight="400" text-anchor="middle">ACCEPT / ABSTAIN</text><line x1="55" y1="390" x2="1145" y2="390" stroke="#176b52" stroke-width="3"/><text x="55" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16px" fill="#176b52" font-weight="700" text-anchor="start">Readable Evidence</text><text x="55" y="456" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14px" fill="#667269" font-weight="400" text-anchor="start">continue through support accounting</text><text x="610" y="428" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16px" fill="#a94442" font-weight="700" text-anchor="start">Evidence not readable</text><text x="610" y="456" font-family="Arial,Microsoft YaHei,sans-serif" font-size="