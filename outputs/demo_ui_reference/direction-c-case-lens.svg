<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
    <rect width="1440" height="1000" fill="#F7F4EC"/>
    <style>
      .h1{font:700 30px "Microsoft YaHei", Arial, sans-serif;fill:#173B35}.h2{font:700 18px "Microsoft YaHei", Arial, sans-serif;fill:#173B35}
      .label{font:600 12px "Microsoft YaHei", Arial, sans-serif;fill:#6B746F;letter-spacing:1px}.body{font:400 14px "Microsoft YaHei", Arial, sans-serif;fill:#173B35}
      .small{font:400 12px "Microsoft YaHei", Arial, sans-serif;fill:#6B746F}.value{font:700 28px "Microsoft YaHei", Arial, sans-serif;fill:#173B35}
      .card{fill:#FFFFFF;stroke:#D9DED7;stroke-width:1}.pill{font:700 11px "Microsoft YaHei", Arial, sans-serif}
    </style>
    <text x="64" y="60" class="h1">案例视角 · 为什么得到这个评价？</text>
    <text x="64" y="88" class="body">聚焦一个案例：沿着证据，从原始信号追踪到最终状态。</text>
    <text x="1370" y="58" text-anchor="end" class="label">DEVELOPMENT ONLY · HUMAN GATE NOT RUN</text>
    <rect x="64" y="125" width="1312" height="112" rx="14" fill="#DCEFE8" stroke="#1F6F63"/><text x="92" y="160" class="label" text-anchor="start">P072 · 案例视角</text><text x="92" y="205" class="h2" text-anchor="start">看似较高的结果，缺少学生证据就无法直接解读。</text><rect x="1110" y="163" width="230" height="25" rx="12" fill="#B85C55"/><text x="1225.0" y="180" text-anchor="middle" class="pill" fill="#FFFFFF">NO_EFFECTIVE_EVIDENCE</text><text x="64" y="285" class="label" text-anchor="start">案例流程</text><circle cx="92" cy="350" r="28" fill="#1F6F63"/><text x="92" y="358" class="h2" text-anchor="#FFFFFF">01</text><text x="136" y="345" class="h2" text-anchor="start">观察表现</text><text x="136" y="370" class="small" text-anchor="start">表现记录</text><path d="M319 350 H356" stroke="#6B746F" stroke-width="2"/><path d="M350 344 L358 350 L350 356" fill="none" stroke="#6B746F" stroke-width="2"/><circle cx="420" cy="350" r="28" fill="#D9874F"/><text x="420" y="358" class="h2" text-anchor="#FFFFFF">02</text><text x="464" y="345" class="h2" text-anchor="start">证据</text><text x="464" y="370" class="small" text-anchor="start">学生信号缺失 / 不清晰</text><path d="M647 350 H684" stroke="#6B746F" stroke-width="2"/><path d="M678 344 L686 350 L678 356" fill="none" stroke="#6B746F" stroke-width="2"/><circle cx="748" cy="350" r="28" fill="#6B746F"/><text x="748" y="358" class="h2" text-anchor="#FFFFFF">03</text><text x="792" y="345" class="h2" text-anchor="start">调整后评价</text><text x="792" y="370" class="small" text-anchor="start">未定义</text><path d="M975 350 H1012" stroke="#6B746F" stroke-width="2"/><path d="M1006 344 L1014 350 L1006 356" fill="none" stroke="#6B746F" stroke-width="2"/><circle cx="1076" cy="350" r="28" fill="#B85C55"/><text x="1076" y="358" class="h2" text-anchor="#FFFFFF">04</text><text x="1120" y="345" class="h2" text-anchor="start">可评估性</text><text x="1120" y="370" class="small" text-anchor="start">无有效证据</text><rect x="64" y="430" width="610" height="470" rx="14" fill="#FFFFFF" stroke="#D9DED7"/><text x="92" y="466" class="label" text-anchor="start">证据分解</text><text x="92" y="525" class="body" text-anchor="start">学生证据强度</text><text x="92" y="550" class="small" text-anchor="start">不可观察 / 权重为零</text><rect x="470" y="511" width="150" height="10" rx="5" fill="#D9DED7"/><rect x="470" y="511" width="18" height="10" rx="5" fill="#B85C55"/><text x="92" y="597" class="body" text-anchor="start">情境完整度</text><text x="92" y="622" class="small" text-anchor="start">情境信息不完整</text><rect x="470" y="583" width="150" height="10" rx="5" fill="#D9DED7"/><rect x="470" y="583" width="18" height="10" rx="5" fill="#B85C55"/><text x="92" y="669" class="body" text-anchor="start">提示 / AI 影响</text><text x="92" y="694" class="small" text-anchor="start">prompt-induced</text><rect x="470" y="655" width="150" height="10" rx="5" fill="#D9DED7"/><rect x="470" y="655" width="42" height="10" rx="5" fill="#D9874F"/><text x="92" y="741" class="body" text-anchor="start">置信度 / 不确定性</text><text x="92" y="766" class="small" text-anchor="start">confidence=low</text><rect x="470" y="727" width="150" height="10" rx="5" fill="#D9DED7"/><rect x="470" y="727" width="18" height="10" rx="5" fill="#B85C55"/><rect x="710" y="430" width="666" height="470" rx="14" fill="#FFFDF8" stroke="#D9DED7"/><text x="738" y="466" class="label" text-anchor="start">人话解释</text><text x="738" y="525" class="h2" text-anchor="start">该记录没有提供足够的</text><text x="738" y="554" class="h2" text-anchor="start">可观察学生证据来支持</text><text x="738" y="583" class="h2" text-anchor="start">强结论。</text><rect x="738" y="635" width="590" height="128" rx="12" fill="#F5DEDA" stroke="#B85C55"/><text x="764" y="670" class="h2" text-anchor="start">NO_EFFECTIVE_EVIDENCE ≠ 0</text><text x="764" y="706" class="body" text-anchor="start">证据不足时，系统拒绝给出虚假的精确结论。</text><text x="738" y="820" class="label" text-anchor="start">公平解读的下一步</text><text x="738" y="854" class="body" text-anchor="start">先展示证据来源，再判断该记录是否</text><text x="738" y="880" class="body" text-anchor="start">可评估。不要仅凭分数推断学生能力。</text></svg>