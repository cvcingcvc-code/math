<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#f7f3e8"/>
<text x="48" y="54" font-family="Arial,Microsoft YaHei,sans-serif" font-size="29px" fill="#19231d" font-weight="700" text-anchor="start">F3 · Evidence Degradation Changes Support; Missing Evidence Triggers Refusal</text>
<text x="48" y="84" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15px" fill="#667269" font-weight="400" text-anchor="start">Paired stress contrasts from the frozen development artifacts. The contrasts are controlled, not causal.</text>
<text x="80" y="180" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18px" fill="#176b52" font-weight="700" text-anchor="start">P108 · controlled development contrast</text><line x1="130" y1="300" x2="700" y2="300" stroke="#dcd8ca" stroke-width="2"/><circle cx="180" cy="237.0" r="11" fill="#d56634" stroke="none" stroke-width="1"/><text x="180" y="217.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15px" fill="#d56634" font-weight="700" text-anchor="middle">R=0.375</text><text x="180" y="340" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14px" fill="#19231d" font-weight="700" text-anchor="middle">Original</text><text x="180" y="365" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13px" fill="#d56634" font-weight="700" text-anchor="middle">adjusted=2.25 · LOW_SUPPORT</text><line x1="192" y1="237.0" x2="398" y2="174.0" stroke="#d56634" stroke-width="3"/><circle cx="410" cy="174.0" r="11" fill="#176b52" stroke="none" stroke-width="1"/><text x="410" y="154.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15px" fill="#176b52" font-weight="700" text-anchor="middle">R=0.750</text><text x="410" y="340" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14px" fill="#19231d" font-weight="700" text-anchor="middle">Prompt removed</text><text x="410" y="365" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13px" fill="#176b52" font-weight="700" text-anchor="middle">adjusted=4.50 · SUPPORTED*</text><line x1="422" y1="174.0" x2="628" y2="258.0" stroke="#176b52" stroke-width="3"/><circle cx="640" cy="258.0" r="11" fill="#a94442" stroke="none" stroke-width="1"/><text x="640" y="238.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15px" fill="#a94442" font-weight="700" text-anchor="middle">R=0.250</text><text x="640" y="340" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14px" fill="#19231d" font-weight="700" text-anchor="middle">Confidence low</text><text x="640" y="365" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13px" fill="#a94442" font-weight="700" text-anchor="middle">adjusted=1.50 · LOW_SUPPORT</text><text x="760" y="175" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18px" fill="#a94442" font-weight="700" text-anchor="start">P072 · context-only recovery</text><rect x="760" y="205" width="365" height="180" rx="12" fill="#f5e9df" stroke="#a94442" stroke-width="1"/><text x="790" y="248" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16px" fill="#19231d" font-weight="700" text-anchor="start">Original</text><text x="790" y="276" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15px" fill="#a94442" font-weight="400" text-anchor="start">UNDETERMINED → NO_EFFECTIVE_EVIDENCE</text><text x="790" y="318" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16px" fill="#19231d" font-weight="700" text-anchor="start">Context restored</text><text x="790" y="346" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15px" fill="#a94442" font-weight="400" text-anchor="start">Evidence unchanged → still NO_EFFECTIVE_EVIDENCE</text><text x="80" y="500" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18px" fill="#19231d" font-weight="700" text-anchor="start">Interpretation</text><text x="80" y="532" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16px" fill="#667269" font-weight="400" text-anchor="start">Removing a declared risk can increase support; restoring a field cannot create new Evidence.</text><text x="80" y="564" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14px" fill="#667269" font-weight="400" text-anchor="start">*SUPPORTED here means the declared support threshold in a controlled development contrast; it is not a Formal Gate result.</text><text x="80" y="590" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15px" fill="#667269" font-weight="400" text-anchor="start">These are controlled development contrasts, not randomized or causal experiments.</text>
<line x1="48" y1="658" x2="1152" y2="658" stroke="#dcd8ca" stroke-width="1"/>
<text x="48" y="684" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12px" fill="#667269" font-weight="400" text-anchor="start">AI_PROVISIONAL · DEVELOPMENT_ONLY · Formal Gate NOT_RUN</text>
</svg>